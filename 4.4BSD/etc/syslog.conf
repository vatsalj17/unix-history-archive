*.err;kern.*;auth.notice;authpriv.none		/dev/console
*.info;mail.crit;ftp.none;authpriv.none		/var/log/messages

# The authpriv log file should be restricted access;
# these messages shouldn't go to terminals or publically-readable files.
authpriv.*					/var/log/secure

lpr.info					/var/log/lpd-errs
mail.*						/var/log/maillog
uucp.info					/var/spool/uucp/ERRORS
ftp.info					/var/log/ftp.log

*.emerg						*
*.alert						root,bostic
*.err;authpriv.none				root,bostic
